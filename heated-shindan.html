.card b.nm{display:block;color:var(--ink);font-size:15px;line-height:1.45}
.why{font-size:13px;color:var(--ink);background:var(--panel);border-radius:4px;padding:6px 10px;margin:0}
.spec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:0}
.spec dt{font-size:11px;color:var(--mute)}
.spec dd{margin:0;font-family:var(--mono);font-size:13px;color:var(--ink);white-space:nowrap}
.cp{font-size:12px;margin:0}
.cp .warn{color:var(--warn)}
.shops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.buy{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--shop);padding:5px 6px 5px 8px;border-radius:3px;line-height:1.4}
.buy .bp{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700}
.buy .bp small{font-family:var(--sans);font-size:10px;font-weight:400;color:var(--mute);margin-left:2px}
.buy .bp.go{font-family:var(--sans);font-size:11px;font-weight:400;color:var(--mute)}
.buy:hover{background:var(--panel)}
.buy.amazon{--shop:var(--amazon)}.buy.rakuten{--shop:var(--rakuten)}.buy.yahoo{--shop:var(--yahoo)}.buy.official{--shop:var(--accent)}
.shops.one{grid-template-columns:1fr}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:2px;background:var(--panel);color:var(--body)}
.tag.new{background:var(--new-soft);color:var(--new)}
.pw{font-size:12px;margin:0;color:var(--body)}
.note{font-size:12px;color:var(--mute);margin:0}
.note a{color:var(--accent)}
@media (max-width:600px){.wrap{padding:4px 0 8px}.box{padding:14px 12px 16px;gap:12px}h2{font-size:19px}.lead{font-size:12.5px}.q{font-size:16px}.opt{padding:10px 12px}.card{padding:12px;gap:6px}.spec dd{font-size:12px}.spec dt{font-size:10.5px}.why{font-size:12.5px}}
</style>
</head>

  else{
    pool=D.filter(PW[st.pw].f);
    const bySty=pool.filter(STY[st.sty].f);
    if(bySty.length)pool=bySty;else note=`「${esc(PW[st.pw].l)}」の中に「${esc(STY[st.sty].l)}」タイプがないため、すべてのタイプから選びました。`;
    const k=PRI[st.pri].k;pool=[...pool].sort((a,b)=>k(a)-k(b)||price(a)-price(b));why=PRI[st.pri].why;
  }
  pool=pool.slice(0,3);
  const cards=pool.map((d,i)=>`<article class="card">
      <span class="rank">候補 ${i+1}</span>
      <div><span class="mk">${esc(d.mk)}</span><span class="md">${esc(d.md)}</span><b class="nm">${esc(d.nm)}</b>${tags(d)}</div>
      <p class="why">${esc(why(d))}</p>
      <dl class="spec"><div><dt>発熱</dt><dd>${d.z?d.z+"か所":"—"}</dd></div><div><dt>最高温度</dt><dd>${d.t?d.t+"℃":"—"}</dd></div><div><dt>最長</dt><dd>${d.runH?d.runH+"時間":"—"}</dd></div><div><dt>洗濯</dt><dd>${d.wash==="—"?"—":(/洗濯機/.test(d.wash)?"洗濯機":"手洗い等")}</dd></div></dl>
      <p class="pw">電源：${esc(d.pw)}</p>
      ${d.warn?`<p class="cp"><span class="warn">${esc(d.warn)}</span></p>`:""}
      ${shops(d)}
    </article>`).join("");
  const more=`全16製品は<a href="https://www.stockmedia.biz/heated-vest" target="_top">電熱ベスト比較（一覧表）</a>で比べられます。`+(CTX==="article"?`会社でまとめて購入する方は、作業服通販<a href="https://x.gd/0n7uS" target="_blank" rel="nofollow sponsored noopener">「フクくる」</a>（PR）もご検討ください。`:"");
  const own=pool.some(d=>d.own)?"「当社もAmazonで販売」の製品は、当サイトの運営会社（Stock合同会社）がAmazonで販売しています。":"";
  const fanNote=st.pw==="fan"&&FAN[st.fan].ids?"お手持ちのバッテリーの型番が「電源」の欄に含まれるか、購入前にご確認ください。":"";
  return `<p class="q">あなたへの候補</p>${note?`<p class="note">${note}</p>`:""}<div class="res">${cards}</div><p class="note">${fanNote}楽天市場・Yahoo!ショッピングの価格は各店の税込最安値（送料別の場合あり）で、毎朝更新しています。Amazonの価格は販売ページでご確認ください。${own}${more}</p>`;
}
render();
fetch(PRICE_URL,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.items){LIVE=j.items;if(cur()==="done")render();}}).catch(()=>{});
</script>
