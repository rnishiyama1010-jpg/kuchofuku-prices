<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>フクくるの3つのポイント</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14181D;--body:#4A545F;--line:#E2E4E6;--navy:#1B3A5C;--orange:#C45200;--soft:#FBF1EA}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:var(--body);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:4px}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:6px;padding:20px 18px 18px;box-shadow:0 1px 3px rgba(20,24,29,.06)}
.ic{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin-bottom:10px}
.ic svg{width:24px;height:24px;stroke:var(--orange);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.no{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--orange)}
h3{margin:2px 0 6px;font-size:18px;line-height:1.4;color:var(--ink)}
p{margin:0;font-size:14px}
@media (max-width:700px){.grid{grid-template-columns:1fr;gap:10px}.card{padding:14px 14px 14px;display:grid;grid-template-columns:44px 1fr;column-gap:12px}.ic{grid-row:span 3;margin:0}h3{font-size:16px}p{font-size:13.5px}}
.cta{display:none}
@media (max-width:700px){.cta{display:block;margin:12px 4px 4px;text-align:center}.cta a{display:block;background:var(--navy);color:#fff;font-weight:700;font-size:15px;text-decoration:none;padding:13px 10px;border-radius:4px}.cta small{display:block;margin-top:6px;font-size:11px;color:#8E959D}}
</style></head>
<body><div class="grid">
<section class="card"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></div><span class="no">POINT 1</span><h3>初期費用・利用料0円</h3><p>何人からでも使えて、最低ロットはありません。少人数の現場でも気軽に頼めます。</p></section>
<section class="card"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg></div><span class="no">POINT 2</span><h3>売掛払いに対応</h3><p>請求書払い（審査あり）が基本で、カード・代引きも相談可。納期は約1週間（刺繍などの加工は約2週間）。</p></section>
<section class="card"><div class="ic"><svg viewBox="0 0 24 24"><path d="M8 4l-4 3 2 4 2-1v10h8V10l2 1 2-4-4-3-2 2h-4z"/></svg></div><span class="no">POINT 3</span><h3>20以上のブランド・名入れ可</h3><p>バートルなど20以上のブランドに対応。刺繍で社名やロゴも入れられます。</p></section>
</div>
<p class="cta"><a href="https://x.gd/0n7uS" target="_top" rel="nofollow sponsored noopener">フクくるで法人発注をはじめる</a><small>PR：フクくる（法人向け作業服の発注サービス）へ移動します</small></p>
</body></html>
