name: 最安値の毎日更新

on:
  schedule:
    - cron: "47 20 * * *"   # 毎朝 5:47（日本時間）
  workflow_dispatch: {}      # Actions 画面から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 価格を取得
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: python fetch_prices.py
      - name: 変更があれば保存
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json diagnostics.json
          git diff --cached --quiet || git commit -m "最安値を更新 $(TZ=Asia/Tokyo date +%F)"
          git push
